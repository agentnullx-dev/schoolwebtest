<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MAGNUS — Precision coaching for JEE & NEET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#00040a;
    --frame-top:#060c1c;
    --frame-bot:#020611;
    --line:rgba(255,255,255,0.09);
    --ink:#f4f7fb;
    --ink-dim:rgba(244,247,251,0.58);
    --ink-faint:rgba(244,247,251,0.34);
    --blue:#1689fe;
    --cyan:#74e8ff;
    --violet:#8b7cff;
    --frame-radius:30px;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--void);
    color:var(--ink);
    font-family:'Manrope', system-ui, sans-serif;
    min-height:100svh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
  }

  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }

  .frame{
    position:relative;
    width:100%;
    max-width:1280px;
    min-height:min(760px, 92svh);
    border-radius:var(--frame-radius);
    overflow:hidden;
    background:
      radial-gradient(ellipse 70% 55% at 50% 40%, rgba(22,137,254,0.16), transparent 60%),
      linear-gradient(180deg, var(--frame-top), var(--frame-bot));
    border:1px solid var(--line);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.02) inset,
      0 0 18px rgba(22,137,254,0.12),
      0 40px 120px rgba(2,6,17,0.7),
      0 0 160px rgba(22,137,254,0.10);
    animation:frameGlow 6s ease-in-out infinite;
    display:flex;
    flex-direction:column;
  }

  #particle-canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    opacity:0.85;
  }

  .frame::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, transparent 40%, rgba(2,6,17,0.55) 100%);
    pointer-events:none;
    z-index:1;
  }

  /* ---------- nav ---------- */
  nav{
    position:relative;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:26px 34px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    font-size:0.95rem;
    letter-spacing:0.02em;
  }

  .brand svg{ display:block; }

  .nav-links{
    display:flex;
    align-items:center;
    gap:34px;
    font-size:0.88rem;
    color:var(--ink-dim);
  }

  .nav-links a{ transition:color .25s ease; }
  .nav-links a:hover{ color:var(--ink); }

  .nav-actions{
    display:flex;
    align-items:center;
    gap:14px;
  }

  .btn-ghost{
    font-size:0.85rem;
    color:var(--ink-dim);
    padding:10px 4px;
    transition:color .25s ease;
  }
  .btn-ghost:hover{ color:var(--ink); }

  .btn-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#f4f7fb;
    color:#05070f;
    font-weight:600;
    font-size:0.85rem;
    padding:11px 20px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .btn-pill:hover{ transform:translateY(-1px); box-shadow:0 10px 30px rgba(244,247,251,0.18); }
  .btn-pill .arrow{ transition:transform .25s ease; }
  .btn-pill:hover .arrow{ transform:translate(2px,-1px); }

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    z-index:5;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px 44px 56px;
  }

  .hero-copy{
    position:relative;
    z-index:2;
    max-width:640px;
  }

  .hero-copy h1,
  .hero-copy p,
  .hero-copy .cta-row{
    text-shadow:0 4px 30px rgba(2,6,17,0.9);
  }

  h1{
    margin:0;
    font-weight:700;
    letter-spacing:-0.03em;
    line-height:1.03;
    font-size:clamp(2.4rem, 4.6vw, 4rem);
    text-wrap:balance;
  }

  h1 .line{ display:block; overflow:hidden; }
  h1 .word{ display:inline-block; }
  h1 .char{ display:inline-block; }

  .hero-copy p{
    margin:22px auto 0;
    max-width:440px;
    font-size:1rem;
    line-height:1.6;
    color:var(--ink-dim);
    font-weight:400;
    opacity:0;
    transform:translateY(16px);
    animation:fadeUp 1.4s cubic-bezier(.16,1,.3,1) 1.6s forwards;
  }

  .cta-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    margin-top:32px;
    opacity:0;
    transform:translateY(16px);
    animation:fadeUp 1.4s cubic-bezier(.16,1,.3,1) 2s forwards;
  }

  @keyframes fadeUp{ to{ opacity:1; transform:translateY(0); } }

  @keyframes frameGlow{
    0%,100%{
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.02) inset,
        0 0 18px rgba(22,137,254,0.12),
        0 40px 120px rgba(2,6,17,0.7),
        0 0 160px rgba(22,137,254,0.10);
    }
    50%{
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 30px rgba(116,232,255,0.24),
        0 40px 120px rgba(2,6,17,0.7),
        0 0 190px rgba(22,137,254,0.18);
    }
  }

  .btn-primary{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.16);
    backdrop-filter:blur(14px);
    color:var(--ink);
    font-weight:600;
    font-size:0.92rem;
    padding:14px 24px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.08), 0 18px 50px rgba(0,90,255,0.14);
    transition:transform .3s ease, border-color .3s ease, background .3s ease;
  }
  .btn-primary:hover{ transform:translateY(-2px); border-color:rgba(120,199,255,0.5); background:rgba(22,137,254,0.16); }
  .btn-primary .arrow{ transition:transform .3s ease; }
  .btn-primary:hover .arrow{ transform:translate(3px,-2px); }

  .link-secondary{
    font-size:0.88rem;
    color:var(--ink-dim);
    border-bottom:1px solid rgba(244,247,251,0.22);
    padding-bottom:2px;
    transition:color .25s ease, border-color .25s ease;
  }
  .link-secondary:hover{ color:var(--ink); border-color:rgba(244,247,251,0.5); }

  /* ---------- responsive ---------- */
  @media (max-width: 640px){
    .nav-links{ display:none; }
    .hero{ padding:8px 24px 40px; }
    nav{ padding:20px 22px; }
    .btn-ghost{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    * { animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }
</style>
</head>
<body>

<div class="frame">
  <canvas id="particle-canvas"></canvas>

  <nav>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <circle cx="11" cy="11" r="2.6" fill="#f4f7fb"/>
        <ellipse cx="11" cy="11" rx="10" ry="4.2" stroke="#74e8ff" stroke-width="1.2"/>
        <ellipse cx="11" cy="11" rx="10" ry="4.2" stroke="#1689fe" stroke-width="1.2" transform="rotate(60 11 11)"/>
        <ellipse cx="11" cy="11" rx="10" ry="4.2" stroke="#8b7cff" stroke-width="1.2" transform="rotate(120 11 11)"/>
      </svg>
      MAGNUS
    </div>

    <div class="nav-links">
      <a href="#">Courses</a>
      <a href="#">Faculty</a>
      <a href="#">Results</a>
    </div>

    <div class="nav-actions">
      <a class="btn-ghost" href="#">Student Login</a>
      <button class="btn-pill">Book a Trial Class <span class="arrow">↗</span></button>
    </div>
  </nav>

  <div class="hero">
    <div class="hero-copy">
      <h1 id="headline"></h1>
      <p>Live doubt-clearing, personalised mark tracking, and a faculty team built around one goal — your rank.</p>
      <div class="cta-row">
        <button class="btn-primary">Start free trial <span class="arrow">↗</span></button>
        <a class="link-secondary" href="#">See how it works</a>
      </div>
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   Headline: character-reveal, same treatment as the source
   ========================================================= */
(function typeHeadline(){
  const el = document.getElementById('headline');
  const lines = ["Precision coaching for", "JEE & NEET achievers", "Magnus Academy"];
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let globalIndex = 0;

  lines.forEach((lineText, li) => {
    const lineEl = document.createElement('span');
    lineEl.className = 'line';
    const words = lineText.split(' ');
    words.forEach((word, wi) => {
      const wordEl = document.createElement('span');
      wordEl.className = 'word';
      [...word].forEach(ch => {
        const charEl = document.createElement('span');
        charEl.className = 'char';
        charEl.textContent = ch;
        const idx = globalIndex++;
        if(!reduce){
          charEl.style.opacity = '0';
          charEl.style.transform = 'translateY(30px)';
          charEl.style.filter = 'blur(7px)';
          charEl.style.transition = 'opacity 1.4s cubic-bezier(.16,1,.3,1), transform 1.4s cubic-bezier(.16,1,.3,1), filter 1.4s cubic-bezier(.16,1,.3,1)';
          setTimeout(() => {
            charEl.style.opacity = '1';
            charEl.style.transform = 'translateY(0)';
            charEl.style.filter = 'blur(0px)';
          }, 500 + idx * 55);
        }
        wordEl.appendChild(charEl);
      });
      lineEl.appendChild(wordEl);
      if(wi < words.length - 1) lineEl.appendChild(document.createTextNode('\u00A0'));
    });
    el.appendChild(lineEl);
  });
})();
</script>

<script>
/* =========================================================
   Background particle field (adapted from LuminousFieldHero)
   ========================================================= */
(function particleField(){
  if(typeof THREE === 'undefined'){ return; }
  const canvas = document.getElementById('particle-canvas');
  const container = canvas.parentElement;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x020611, 0.055);

  const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 100);
  camera.position.set(0, 0, 7.2);

  const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true, powerPreference:'high-performance' });
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const isCompact = window.matchMedia('(max-width: 640px)').matches;
  const particleCount = isCompact ? 6000 : 12000;

  const positions = new Float32Array(particleCount * 3);
  const origins = new Float32Array(particleCount * 3);
  const velocities = new Float32Array(particleCount * 3);
  const colors = new Float32Array(particleCount * 3);

  const blue = new THREE.Color('#1689fe');
  const cyan = new THREE.Color('#74e8ff');
  const violet = new THREE.Color('#8b7cff');
  const color = new THREE.Color();

  for(let i = 0; i < particleCount; i += 1){
    const idx = i * 3;
    const t = (i / particleCount) * Math.PI * 6;
    const phase = Math.random() * Math.PI * 2;
    const spread = (Math.random() - 0.5) * 0.34;
    const haze = (Math.random() - 0.5) * 0.13;
    const ring = 1.32 + 0.5 * Math.cos(3 * t);

    const x = ring * Math.cos(2*t) + Math.cos(phase)*spread + haze;
    const y = ring * Math.sin(2*t) + Math.sin(phase)*spread + haze;
    const z = 0.62 * Math.sin(3*t) + Math.sin(phase*1.7)*spread;

    positions[idx] = x; positions[idx+1] = y; positions[idx+2] = z;
    origins[idx] = x; origins[idx+1] = y; origins[idx+2] = z;

    const mix = (Math.sin(t*0.65)+1)*0.5;
    color.copy(mix < 0.55 ? blue : violet).lerp(cyan, mix < 0.55 ? mix/0.55 : (1-mix)/0.45);
    const brightness = 0.68 + Math.random()*0.32;
    colors[idx] = color.r*brightness; colors[idx+1] = color.g*brightness; colors[idx+2] = color.b*brightness;
  }

  const geometry = new THREE.BufferGeometry();
  const positionAttribute = new THREE.BufferAttribute(positions, 3);
  positionAttribute.setUsage(THREE.DynamicDrawUsage);
  geometry.setAttribute('position', positionAttribute);
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const material = new THREE.PointsMaterial({
    size: isCompact ? 0.035 : 0.024,
    sizeAttenuation:true,
    vertexColors:true,
    transparent:true,
    opacity:0.8,
    depthWrite:false,
    blending:THREE.AdditiveBlending
  });

  const cloud = new THREE.Points(geometry, material);
  cloud.rotation.x = -0.18;
  scene.add(cloud);

  let pointerActive = false, pointerX = 10, pointerY = 10, smoothX = 10, smoothY = 10;
  let frameId = 0, running = true;
  const clock = new THREE.Clock();

  function resize(){
    const b = container.getBoundingClientRect();
    const w = Math.max(1,b.width), h = Math.max(1,b.height);
    camera.aspect = w/h; camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isCompact ? 1.5 : 1.8));
    renderer.setSize(w,h,false);
    const scale = w < 520 ? 0.72 : w < 900 ? 0.86 : 1;
    cloud.scale.setScalar(scale);
  }

  function updatePointer(e){
    const b = container.getBoundingClientRect();
    pointerX = (((e.clientX-b.left)/b.width)*2-1)*3.15;
    pointerY = (1-((e.clientY-b.top)/b.height)*2)*2.25;
    pointerActive = true;
  }
  function clearPointer(){ pointerActive = false; pointerX = 10; pointerY = 10; }

  function animate(){
    if(!running) return;
    frameId = requestAnimationFrame(animate);
    const time = clock.getElapsedTime();
    smoothX += (pointerX - smoothX) * 0.08;
    smoothY += (pointerY - smoothY) * 0.08;

    if(!reduceMotion){
      const radius = 1.35, radiusSq = radius*radius;
      for(let i=0;i<particleCount;i+=1){
        const idx = i*3;
        const x = positions[idx], y = positions[idx+1], z = positions[idx+2];
        let vx = velocities[idx], vy = velocities[idx+1], vz = velocities[idx+2];

        if(pointerActive){
          const dx = x - smoothX, dy = y - smoothY;
          const distSq = dx*dx + dy*dy + z*z*0.22;
          if(distSq < radiusSq){
            const dist = Math.sqrt(distSq) + 0.0001;
            const force = (1 - dist/radius) * 0.026;
            vx += (dx/dist)*force; vy += (dy/dist)*force; vz += (z/dist)*force*0.35;
          }
        }
        const drift = Math.sin(time*0.8 + i*0.017)*0.008;
        vx += (origins[idx]-x)*0.013;
        vy += (origins[idx+1]+drift-y)*0.013;
        vz += (origins[idx+2]-z)*0.013;
        vx*=0.91; vy*=0.91; vz*=0.91;

        positions[idx]+=vx; positions[idx+1]+=vy; positions[idx+2]+=vz;
        velocities[idx]=vx; velocities[idx+1]=vy; velocities[idx+2]=vz;
      }
      positionAttribute.needsUpdate = true;
      cloud.rotation.y = time*0.075 + smoothX*0.018;
      cloud.rotation.x = -0.18 - smoothY*0.012;
    }
    renderer.render(scene, camera);
  }

  function handleVisibility(){
    if(document.hidden){ running=false; cancelAnimationFrame(frameId); }
    else if(!running){ running=true; clock.getDelta(); animate(); }
  }

  new ResizeObserver(resize).observe(container);
  window.addEventListener('pointermove', updatePointer, {passive:true});
  window.addEventListener('blur', clearPointer);
  document.addEventListener('visibilitychange', handleVisibility);

  resize();
  animate();
})();
</script>

</body>
</html>
