<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ACE — Precision coaching for JEE & NEET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#00040a;
    --frame-top:#060c1c;
    --frame-bot:#020611;
    --line:rgba(255,255,255,0.09);
    --ink:#f4f7fb;
    --ink-dim:rgba(244,247,251,0.58);
    --ink-faint:rgba(244,247,251,0.34);
    --blue:#1689fe;
    --cyan:#74e8ff;
    --violet:#8b7cff;
    --frame-radius:30px;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--void);
    color:var(--ink);
    font-family:'Manrope', system-ui, sans-serif;
    min-height:100svh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
  }

  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }

  .frame{
    position:relative;
    width:100%;
    max-width:1280px;
    min-height:min(760px, 92svh);
    border-radius:var(--frame-radius);
    overflow:hidden;
    background:
      radial-gradient(ellipse 70% 55% at 50% 40%, rgba(22,137,254,0.16), transparent 60%),
      linear-gradient(180deg, var(--frame-top), var(--frame-bot));
    border:1px solid var(--line);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.02) inset,
      0 40px 120px rgba(2,6,17,0.7),
      0 0 160px rgba(22,137,254,0.10);
    display:flex;
    flex-direction:column;
  }

  #particle-canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    opacity:0.85;
  }

  .graph-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:88% 30%;
    z-index:1;
    opacity:0.4;
    mix-blend-mode:screen;
    pointer-events:none;
    -webkit-mask-image:radial-gradient(ellipse 55% 65% at 78% 32%, black 30%, transparent 75%);
    mask-image:radial-gradient(ellipse 55% 65% at 78% 32%, black 30%, transparent 75%);
  }

  /* keeps the headline readable regardless of what's moving behind it */
  .hero-vignette{
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:radial-gradient(ellipse 46% 40% at 50% 46%, rgba(2,6,17,0.55), transparent 72%);
  }

  .frame::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, transparent 40%, rgba(2,6,17,0.55) 100%);
    pointer-events:none;
    z-index:1;
  }

  /* ---------- nav ---------- */
  nav{
    position:relative;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:26px 34px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    font-size:0.95rem;
    letter-spacing:0.02em;
  }

  .brand svg{ display:block; }

  .nav-links{
    display:flex;
    align-items:center;
    gap:34px;
    font-size:0.88rem;
    color:var(--ink-dim);
  }

  .nav-links a{ transition:color .25s ease; }
  .nav-links a:hover{ color:var(--ink); }

  .nav-actions{
    display:flex;
    align-items:center;
    gap:14px;
  }

  .btn-ghost{
    font-size:0.85rem;
    color:var(--ink-dim);
    padding:10px 4px;
    transition:color .25s ease;
  }
  .btn-ghost:hover{ color:var(--ink); }

  .btn-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#f4f7fb;
    color:#05070f;
    font-weight:600;
    font-size:0.85rem;
    padding:11px 20px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .btn-pill:hover{ transform:translateY(-1px); box-shadow:0 10px 30px rgba(244,247,251,0.18); }
  .btn-pill .arrow{ transition:transform .25s ease; }
  .btn-pill:hover .arrow{ transform:translate(2px,-1px); }

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    z-index:5;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px 44px 56px;
  }

  .hero-copy{
    position:relative;
    z-index:2;
    max-width:640px;
  }

  .hero-copy h1,
  .hero-copy p,
  .hero-copy .cta-row{
    text-shadow:0 4px 30px rgba(2,6,17,0.9);
  }

  h1{
    margin:0;
    font-weight:700;
    letter-spacing:-0.03em;
    line-height:1.03;
    font-size:clamp(2.4rem, 4.6vw, 4rem);
    text-wrap:balance;
  }

  h1 .line{ display:block; overflow:hidden; }
  h1 .word{ display:inline-block; }
  h1 .char{ display:inline-block; }

  .hero-copy p{
    margin:22px auto 0;
    max-width:440px;
    font-size:1rem;
    line-height:1.6;
    color:var(--ink-dim);
    font-weight:400;
    opacity:0;
    transform:translateY(16px);
    animation:fadeUp 1.4s cubic-bezier(.16,1,.3,1) 1.6s forwards;
  }

  .cta-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    margin-top:32px;
    opacity:0;
    transform:translateY(16px);
    animation:fadeUp 1.4s cubic-bezier(.16,1,.3,1) 2s forwards;
  }

  @keyframes fadeUp{ to{ opacity:1; transform:translateY(0); } }

  .btn-primary{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.16);
    backdrop-filter:blur(14px);
    color:var(--ink);
    font-weight:600;
    font-size:0.92rem;
    padding:14px 24px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.08), 0 18px 50px rgba(0,90,255,0.14);
    transition:transform .3s ease, border-color .3s ease, background .3s ease;
  }
  .btn-primary:hover{ transform:translateY(-2px); border-color:rgba(120,199,255,0.5); background:rgba(22,137,254,0.16); }
  .btn-primary .arrow{ transition:transform .3s ease; }
  .btn-primary:hover .arrow{ transform:translate(3px,-2px); }

  .link-secondary{
    font-size:0.88rem;
    color:var(--ink-dim);
    border-bottom:1px solid rgba(244,247,251,0.22);
    padding-bottom:2px;
    transition:color .25s ease, border-color .25s ease;
  }
  .link-secondary:hover{ color:var(--ink); border-color:rgba(244,247,251,0.5); }

  #atom-canvas{ width:100%; height:100%; display:block; }

  .atom-corner{
    position:absolute;
    right:36px;
    bottom:32px;
    width:96px;
    height:96px;
    z-index:4;
    opacity:0;
    animation:fadeUp 1.4s cubic-bezier(.16,1,.3,1) 2.4s forwards;
  }

  /* ---------- responsive ---------- */
  @media (max-width: 640px){
    .nav-links{ display:none; }
    .hero{ padding:8px 24px 40px; }
    .atom-corner{ width:64px; height:64px; right:20px; bottom:20px; }
    nav{ padding:20px 22px; }
    .btn-ghost{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    * { animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }
</style>
</head>

<script>
/* =========================================================
   Headline: character-reveal, same treatment as the source
   ========================================================= */
(function typeHeadline(){
  const el = document.getElementById('headline');
  const lines = ["Precision coaching for", "JEE & NEET achievers"];
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let globalIndex = 0;

  lines.forEach((lineText, li) => {
    const lineEl = document.createElement('span');
    lineEl.className = 'line';
    const words = lineText.split(' ');
    words.forEach((word, wi) => {
      const wordEl = document.createElement('span');
      wordEl.className = 'word';
      [...word].forEach(ch => {
        const charEl = document.createElement('span');
        charEl.className = 'char';
        charEl.textContent = ch;
        const idx = globalIndex++;
        if(!reduce){
          charEl.style.opacity = '0';
          charEl.style.transform = 'translateY(30px)';
          charEl.style.filter = 'blur(7px)';
          charEl.style.transition = 'opacity 1.4s cubic-bezier(.16,1,.3,1), transform 1.4s cubic-bezier(.16,1,.3,1), filter 1.4s cubic-bezier(.16,1,.3,1)';
          setTimeout(() => {
            charEl.style.opacity = '1';
            charEl.style.transform = 'translateY(0)';
            charEl.style.filter = 'blur(0px)';
          }, 500 + idx * 55);
        }
        wordEl.appendChild(charEl);
      });
      lineEl.appendChild(wordEl);
      if(wi < words.length - 1) lineEl.appendChild(document.createTextNode('\u00A0'));
    });
    el.appendChild(lineEl);
  });
})();
</script>

<script>
/* =========================================================
   Background particle field (adapted from LuminousFieldHero)
   ========================================================= */
(function particleField(){
  if(typeof THREE === 'undefined'){ return; }
  const canvas = document.getElementById('particle-canvas');
  const container = canvas.parentElement;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x020611, 0.055);

  const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 100);
  camera.position.set(0, 0, 7.2);

  const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true, powerPreference:'high-performance' });
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const isCompact = window.matchMedia('(max-width: 640px)').matches;
  const particleCount = isCompact ? 6000 : 12000;

  const positions = new Float32Array(particleCount * 3);
  const origins = new Float32Array(particleCount * 3);
  const velocities = new Float32Array(particleCount * 3);
  const colors = new Float32Array(particleCount * 3);

  const blue = new THREE.Color('#1689fe');
  const cyan = new THREE.Color('#74e8ff');
  const violet = new THREE.Color('#8b7cff');
  const color = new THREE.Color();

  for(let i = 0; i < particleCount; i += 1){
    const idx = i * 3;
    const t = (i / particleCount) * Math.PI * 6;
    const phase = Math.random() * Math.PI * 2;
    const spread = (Math.random() - 0.5) * 0.34;
    const haze = (Math.random() - 0.5) * 0.13;
    const ring = 1.32 + 0.5 * Math.cos(3 * t);

    const x = ring * Math.cos(2*t) + Math.cos(phase)*spread + haze;
    const y = ring * Math.sin(2*t) + Math.sin(phase)*spread + haze;
    const z = 0.62 * Math.sin(3*t) + Math.sin(phase*1.7)*spread;

    positions[idx] = x; positions[idx+1] = y; positions[idx+2] = z;
    origins[idx] = x; origins[idx+1] = y; origins[idx+2] = z;

    const mix = (Math.sin(t*0.65)+1)*0.5;
    color.copy(mix < 0.55 ? blue : violet).lerp(cyan, mix < 0.55 ? mix/0.55 : (1-mix)/0.45);
    const brightness = 0.68 + Math.random()*0.32;
    colors[idx] = color.r*brightness; colors[idx+1] = color.g*brightness; colors[idx+2] = color.b*brightness;
  }

  const geometry = new THREE.BufferGeometry();
  const positionAttribute = new THREE.BufferAttribute(positions, 3);
  positionAttribute.setUsage(THREE.DynamicDrawUsage);
  geometry.setAttribute('position', positionAttribute);
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const material = new THREE.PointsMaterial({
    size: isCompact ? 0.035 : 0.024,
    sizeAttenuation:true,
    vertexColors:true,
    transparent:true,
    opacity:0.8,
    depthWrite:false,
    blending:THREE.AdditiveBlending
  });

  const cloud = new THREE.Points(geometry, material);
  cloud.rotation.x = -0.18;
  scene.add(cloud);

  let pointerActive = false, pointerX = 10, pointerY = 10, smoothX = 10, smoothY = 10;
  let frameId = 0, running = true;
  const clock = new THREE.Clock();

  function resize(){
    const b = container.getBoundingClientRect();
    const w = Math.max(1,b.width), h = Math.max(1,b.height);
    camera.aspect = w/h; camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isCompact ? 1.5 : 1.8));
    renderer.setSize(w,h,false);
    const scale = w < 520 ? 0.72 : w < 900 ? 0.86 : 1;
    cloud.scale.setScalar(scale);
  }

  function updatePointer(e){
    const b = container.getBoundingClientRect();
    pointerX = (((e.clientX-b.left)/b.width)*2-1)*3.15;
    pointerY = (1-((e.clientY-b.top)/b.height)*2)*2.25;
    pointerActive = true;
  }
  function clearPointer(){ pointerActive = false; pointerX = 10; pointerY = 10; }

  function animate(){
    if(!running) return;
    frameId = requestAnimationFrame(animate);
    const time = clock.getElapsedTime();
    smoothX += (pointerX - smoothX) * 0.08;
    smoothY += (pointerY - smoothY) * 0.08;

    if(!reduceMotion){
      const radius = 1.35, radiusSq = radius*radius;
      for(let i=0;i<particleCount;i+=1){
        const idx = i*3;
        const x = positions[idx], y = positions[idx+1], z = positions[idx+2];
        let vx = velocities[idx], vy = velocities[idx+1], vz = velocities[idx+2];

        if(pointerActive){
          const dx = x - smoothX, dy = y - smoothY;
          const distSq = dx*dx + dy*dy + z*z*0.22;
          if(distSq < radiusSq){
            const dist = Math.sqrt(distSq) + 0.0001;
            const force = (1 - dist/radius) * 0.026;
            vx += (dx/dist)*force; vy += (dy/dist)*force; vz += (z/dist)*force*0.35;
          }
        }
        const drift = Math.sin(time*0.8 + i*0.017)*0.008;
        vx += (origins[idx]-x)*0.013;
        vy += (origins[idx+1]+drift-y)*0.013;
        vz += (origins[idx+2]-z)*0.013;
        vx*=0.91; vy*=0.91; vz*=0.91;

        positions[idx]+=vx; positions[idx+1]+=vy; positions[idx+2]+=vz;
        velocities[idx]=vx; velocities[idx+1]=vy; velocities[idx+2]=vz;
      }
      positionAttribute.needsUpdate = true;
      cloud.rotation.y = time*0.075 + smoothX*0.018;
      cloud.rotation.x = -0.18 - smoothY*0.012;
    }
    renderer.render(scene, camera);
  }

  function handleVisibility(){
    if(document.hidden){ running=false; cancelAnimationFrame(frameId); }
    else if(!running){ running=true; clock.getDelta(); animate(); }
  }

  new ResizeObserver(resize).observe(container);
  window.addEventListener('pointermove', updatePointer, {passive:true});
  window.addEventListener('blur', clearPointer);
  document.addEventListener('visibilitychange', handleVisibility);

  resize();
  animate();
})();
</script>

<script>
/* =========================================================
   Spinning atom (adapted from OrbCoil)
   ========================================================= */
(function orbCoil(){
  const TAU = Math.PI*2, PERIOD = 6, BASE_SPREAD = 0.3, PERSPECTIVE = 3.5;
  const MIN_RADIUS = 0.6, MAX_DOTS = 1024, MAX_DPR = 2;

  function clamp01(x){ return x<0?0:x>1?1:x; }
  function clampN(v,lo,hi){ return v<lo?lo:v>hi?hi:v; }
  function dotsN(base,n){ const v=Math.round(base*n); return v<1?1:v; }

  function spin(p, yaw, pitch){
    const ca=Math.cos(yaw), sa=Math.sin(yaw);
    const rx = p[0]*ca - p[2]*sa;
    let rz = p[0]*sa + p[2]*ca;
    const co=Math.cos(pitch), so=Math.sin(pitch);
    const ry = p[1]*co - rz*so;
    rz = p[1]*so + rz*co;
    return [rx, ry, rz, p[3], p[4], p[5]];
  }

  function frame(t, P, out){
    const n = dotsN(150, P.n);
    const turns = 4 + 4*(0.5 - 0.5*Math.cos(TAU*t));
    for(let i=0;i<n;i+=1){
      const u = (i/n + t) % 1;
      const th = Math.PI*u;
      const sr = Math.sin(th);
      const az = u*TAU*turns + TAU*t;
      const f = Math.pow(Math.sin(Math.PI*u), 0.45);
      out.push(spin([Math.cos(az)*sr, Math.cos(th), Math.sin(az)*sr, 0.6+0.9*f, f, i%15===0?P.acc:P.dot], 0.3, 0.36));
    }
  }

  function project(pts, size, P, emit){
    const c = size/2;
    const R = size*BASE_SPREAD*P.sp;
    const pv = PERSPECTIVE;
    const yaw = P.yw + TAU*P.sn*P.t;
    const list = [];
    for(const p of pts){
      const q = spin(p, yaw, P.pc);
      const z = q[2];
      const s = pv/(pv-z);
      const f = clamp01((z+1.1)/2.2);
      list.push([
        c + q[0]*R*s,
        c + q[1]*R*s,
        P.ds*(0.4+1.6*f)*s*(q[3]===undefined?1:q[3]),
        (0.07+0.93*Math.pow(f,1.55))*(q[4]===undefined?1:q[4]),
        q[5]||P.dot,
        z
      ]);
    }
    list.sort((a,b)=>a[5]-b[5]);
    for(const d of list) emit(d[0], d[1], d[2], d[3], d[4]);
  }

  const fitCache = new Map();
  function autoFit(size, P, restYaw, restPitch){
    const key = size+'/'+P.n+'/'+P.sp+'/'+restYaw+'/'+restPitch+'/'+P.sn;
    if(fitCache.has(key)) return fitCache.get(key);
    const half = size/2;
    let ext = 0;
    const probe = Object.assign({}, P, {ds:1, dot:'#fff', acc:'#fff', t:0, yw:restYaw, pc:restPitch});
    const emit = (x,y,r,a) => { if(a<=0.05||r<=0.15) return; ext = Math.max(ext, Math.abs(x-half)+0.5*r, Math.abs(y-half)+0.5*r); };
    for(let k=0;k<20;k+=1){
      probe.t = k/20;
      const out = [];
      frame(probe.t, probe, out);
      project(out, size, probe, emit);
    }
    const fit = ext>1 ? Math.max(0.55, Math.min(1.7, (0.415*size)/ext)) : 1;
    fitCache.set(key, fit);
    return fit;
  }

  function dotScaleFor(size){
    if(size<=46) return 0.4;
    if(size<=190) return 0.4 + ((size-46)/144)*0.6;
    if(size<=340) return 1 + ((size-190)/150)*0.55;
    return 1.55;
  }

  function parseColor(input, fb){
    if(!input) return fb;
    const str = String(input).trim();
    if(str.charAt(0)==='#'){
      let hex = str.slice(1);
      if(hex.length===3||hex.length===4) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2]+(hex.length===4?hex[3]+hex[3]:'');
      if(hex.length>=6){
        const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
        const a = hex.length>=8 ? parseInt(hex.slice(6,8),16)/255 : 1;
        if(!isNaN(r)&&!isNaN(g)&&!isNaN(b)) return [r,g,b,a];
      }
      return fb;
    }
    return fb;
  }
  function css(c){ return 'rgba('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+','+c[3]+')'; }

  const canvas = document.getElementById('atom-canvas');
  const ctx = canvas.getContext('2d');

  const v = {
    dot: '#bfe3ff',
    acc: '#74e8ff',
    speed: 64/50,
    density: 190/100,
    dotSize: 80/100,
    spinTurns: 1,
    drag: 100/100,
    damping: 47,
    spread: 180/100,
    turn: (-180*Math.PI)/180,
    tilt: (16*Math.PI)/180
  };

  const drag = { active:false, lx:0, ly:0, lt:0, yaw:0, pitch:0, vx:0, vy:0 };
  let raf = 0, last = performance.now(), phase = 0;

  function render(now){
    const dt = Math.min(0.05, (now-last)/1000);
    last = now;

    const dpr = Math.min(window.devicePixelRatio||1, MAX_DPR);
    const cw = canvas.clientWidth || 120, ch = canvas.clientHeight || 120;
    const bw = Math.max(1, Math.round(cw*dpr)), bh = Math.max(1, Math.round(ch*dpr));
    if(canvas.width!==bw||canvas.height!==bh){ canvas.width=bw; canvas.height=bh; }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cw,ch);

    phase = (phase + (dt*v.speed)/PERIOD) % 1;
    if(phase<0) phase += 1;

    const size = Math.max(4, Math.min(cw,ch));
    const bx = (cw-size)/2, by = (ch-size)/2;

    const dotCol = css(parseColor(v.dot, [191,227,255,1]));
    const accCol = css(parseColor(v.acc, [116,232,255,1]));

    if(!drag.active){
      const decay = Math.exp(-v.damping*0.12*dt);
      drag.yaw += drag.vx*dt; drag.pitch += drag.vy*dt;
      drag.vx *= decay; drag.vy *= decay;
    }
    const restPitch = v.tilt;
    drag.pitch = clampN(drag.pitch, -Math.PI/2-restPitch, Math.PI/2-restPitch);

    const P = {
      n:v.density, sp:v.spread, ds:dotScaleFor(size)*v.dotSize,
      yw:v.turn+drag.yaw, sn:v.spinTurns, pc:restPitch+drag.pitch,
      t:phase, dot:dotCol, acc:accCol
    };

    const fit = autoFit(size, P, v.turn, restPitch);
    const half = size/2;

    const out = [];
    frame(phase, P, out);
    let drawn = 0;
    project(out, size, P, (x,y,r,a,col) => {
      if(drawn>=MAX_DOTS) return;
      const rr = r*(0.55+0.45*fit);
      if(rr<=0.05||a<=0.004) return;
      const cx = bx+half+(x-half)*fit;
      const cy = by+half+(y-half)*fit;
      let dr=rr, da=Math.min(1,a);
      if(dr<MIN_RADIUS){ da *= (dr/MIN_RADIUS)*(dr/MIN_RADIUS); dr=MIN_RADIUS; }
      ctx.globalAlpha = da;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(cx,cy,dr,0,TAU);
      ctx.fill();
      drawn += 1;
    });
    ctx.globalAlpha = 1;

    raf = requestAnimationFrame(render);
  }

  canvas.addEventListener('pointerdown', e => {
    if(v.drag<=0) return;
    drag.active = true; drag.lx = e.clientX; drag.ly = e.clientY; drag.lt = performance.now();
    drag.vx = 0; drag.vy = 0;
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  });
  canvas.addEventListener('pointermove', e => {
    if(!drag.active) return;
    const k = (v.drag*TAU)/Math.max(1, canvas.clientWidth||120);
    const dx = (e.clientX-drag.lx)*k, dy = (e.clientY-drag.ly)*k;
    const now2 = performance.now(); const span = Math.max(1, now2-drag.lt);
    drag.lx = e.clientX; drag.ly = e.clientY; drag.lt = now2;
    drag.yaw -= dx; drag.pitch += dy;
    drag.vx = (-dx/span)*1000; drag.vy = (dy/span)*1000;
  });
  window.addEventListener('pointerup', () => drag.active = false);
  window.addEventListener('pointercancel', () => drag.active = false);
  canvas.style.touchAction = 'none';

  raf = requestAnimationFrame(render);
})();
</script>
